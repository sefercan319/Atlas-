name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract project zip
        run: |
          ZIP=$(ls *.zip | sort | tail -n 1)
          echo "Zip: $ZIP"
          unzip -q "$ZIP" -d .
          test -f odak/settings.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.8.2

      - name: Unit tests
        working-directory: odak
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: odak
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-debug-apk
          path: odak/app/build/outputs/apk/debug/*.apk
